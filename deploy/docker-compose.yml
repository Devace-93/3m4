name: 3m4

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs migrations + seeds, then exits. Other services wait for it.
  migrate:
    build: { context: .., dockerfile: services/api/Dockerfile }
    command: ["python", "-m", "dbcore.cli", "upgrade-and-seed"]
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    env_file: ../.env
    environment:
      # The accounts api on the shared `edge` network (same name in prod).
      ACCOUNTS_INTERNAL_URL: ${ACCOUNTS_INTERNAL_URL:-http://accounts-api-1:5000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["5000"]
    # `edge` is the external network shared with the accounts stack (and the
    # sibling apps in production). `make up` creates it when missing.
    networks: [default, edge]
    restart: unless-stopped

  redirect:
    build: { context: .., dockerfile: services/redirect/Dockerfile }
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["5001"]
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    command: ["celery", "-A", "worker.app.celery", "worker", "--loglevel=info"]
    env_file: ../.env
    volumes:
      - ./geoip:/geoip:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build: { context: .., dockerfile: services/worker/Dockerfile }
    command: ["celery", "-A", "worker.app.celery", "beat", "--loglevel=info"]
    env_file: ../.env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # VITE_* are inlined at build time. Interpolated from the repo-root .env
      # (run compose from the repo root). Override per environment as needed.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ACCOUNTS_URL: ${VITE_ACCOUNTS_URL:-${ACCOUNTS_URL:-http://localhost:8085}}
        VITE_SHORT_DOMAIN: ${VITE_SHORT_DOMAIN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
        VITE_REVENUECAT_PUBLIC_KEY: ${VITE_REVENUECAT_PUBLIC_KEY:-}
        VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-true}
        VITE_INFO_URL: ${VITE_INFO_URL:-https://info.3m4.net}
        VITE_RETRO_PROJECT_KEY: ${VITE_RETRO_PROJECT_KEY:-}
        VITE_RETRO_WIDGET_URL: ${VITE_RETRO_WIDGET_URL:-https://retro.3m4.net/widget.js}
        VITE_METRICS_PROJECT_KEY: ${VITE_METRICS_PROJECT_KEY:-}
        VITE_METRICS_TRACKER_URL: ${VITE_METRICS_TRACKER_URL:-https://metrics.3m4.net/m.js}
    env_file: ../.env
    environment:
      # SSR resolves feature flags straight from the API over the internal network.
      API_INTERNAL_URL: http://api:5000/api
    expose: ["3000"]
    restart: unless-stopped

  # Remote MCP server (Streamable HTTP) for AI agents. Auth = 3m4 API key as
  # a Bearer token; it only talks to the API service over the internal network.
  mcp:
    build: { context: .., dockerfile: packages/mcp-server/Dockerfile }
    environment:
      M4_API_URL: http://api:5000/api
      M4_MCP_PORT: "3333"
      M4_AUDIT_LOG: stderr
    depends_on:
      api: { condition: service_started }
    expose: ["3333"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
      # - "80:80"
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, web, redirect, mcp]
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
