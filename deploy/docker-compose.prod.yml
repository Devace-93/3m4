# Production overrides. Run from deploy/ with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Same target path as the dev mount, so compose replaces it with the prod file.
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
      # Static side apps — enable together with the blocks in Caddyfile.prod:
      # - /srv/static:/srv/static:ro
    # `edge` is a shared external network (docker network create edge) that
    # sibling stacks on this box join (exp at /opt/exp) so this Caddy can route
    # their subdomains by container name. Create it before deploying.
    networks: [default, edge]

networks:
  edge:
    external: true
